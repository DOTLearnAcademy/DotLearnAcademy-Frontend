<div class="profile-page">
  <div class="page-header">
    <h1>Profile</h1>
  </div>

  <mat-card class="profile-card">
    <mat-card-content>
      <!-- Avatar display only (no upload) -->
      <div class="avatar-section">
        <div class="avatar-circle">
          <img *ngIf="avatarUrl" [src]="avatarUrl" alt="Profile"
               referrerpolicy="no-referrer"
               style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
          <mat-icon *ngIf="!avatarUrl">person</mat-icon>
        </div>
        <div class="user-name-display">{{ user.fullName }}</div>
      </div>

      <!-- Read-only info rows -->
      <div class="info-row">
        <span class="info-label">Full Name</span>
        <span class="info-value">{{ user.fullName || '—' }}</span>
      </div>

      <div class="info-row">
        <span class="info-label">Email</span>
        <span class="info-value">{{ user.email || '—' }}</span>
      </div>

      <div class="info-row">
        <span class="info-label">Role</span>
        <span class="info-value role-badge">{{ user.role || '—' }}</span>
      </div>
    </mat-card-content>
  </mat-card>
</div>
