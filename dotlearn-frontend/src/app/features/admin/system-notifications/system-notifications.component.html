<div class="notifications-page">
  <div class="page-header">
    <h1>System Notifications</h1>
    <p>Broadcast messages to users by role</p>
  </div>

  <mat-card class="compose-card">
    <mat-card-header>
      <mat-card-title>Compose Broadcast</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Message</mat-label>
          <textarea matInput formControlName="body" rows="5"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Target Audience</mat-label>
          <mat-select formControlName="targetRole">
            <mat-option value="All">All Users</mat-option>
            <mat-option value="Student">Students Only</mat-option>
            <mat-option value="Instructor">Instructors Only</mat-option>
          </mat-select>
        </mat-form-field>

        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit"
                  [disabled]="isSubmitting || form.invalid">
            <mat-icon>send</mat-icon>
            {{ isSubmitting ? 'Sending...' : 'Send Notification' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
