<div class="users-page">
  <div class="page-header">
    <h1>User Management</h1>
  </div>

  <div class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Search users</mat-label>
      <input matInput [formControl]="searchControl" placeholder="Name or email">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Filter by role</mat-label>
      <mat-select [formControl]="roleControl">
        <mat-option value="">All Roles</mat-option>
        <mat-option value="Student">Student</mat-option>
        <mat-option value="Instructor">Instructor</mat-option>
        <mat-option value="Admin">Admin</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <mat-progress-bar mode="indeterminate" *ngIf="isLoading"></mat-progress-bar>

  <mat-table [dataSource]="users" *ngIf="!isLoading" class="users-table">
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef>Name</mat-header-cell>
      <mat-cell *matCellDef="let u">{{ u.fullName }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="email">
      <mat-header-cell *matHeaderCellDef>Email</mat-header-cell>
      <mat-cell *matCellDef="let u">{{ u.email }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="role">
      <mat-header-cell *matHeaderCellDef>Role</mat-header-cell>
      <mat-cell *matCellDef="let u">
        <mat-chip>{{ u.role }}</mat-chip>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
      <mat-cell *matCellDef="let u">
        <mat-chip [color]="u.isActive ? 'accent' : 'warn'" selected>
          {{ u.isActive ? 'Active' : 'Suspended' }}
        </mat-chip>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let u">
        <button mat-icon-button *ngIf="u.isActive" (click)="suspend(u.id)"
                matTooltip="Suspend">
          <mat-icon>block</mat-icon>
        </button>
        <button mat-icon-button *ngIf="!u.isActive" (click)="unsuspend(u.id)"
                matTooltip="Unsuspend" color="accent">
          <mat-icon>check_circle</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(u.id)"
                matTooltip="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
</div>
