<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Forgot Password</mat-card-title>
      <mat-card-subtitle>Password reset via email</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="coming-soon-notice">
        <mat-icon class="notice-icon">construction</mat-icon>
        <h3>Coming Soon</h3>
        <p>
          Automated password reset emails are not yet available.
          If you've forgotten your password, please contact us and
          we'll reset it for you manually.
        </p>
        <p class="contact-text">
          <mat-icon inline>email</mat-icon>
          support&#64;dotlearn.academy
        </p>
      </div>

      <div class="auth-links">
        <a routerLink="/auth/login">← Back to Sign In</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
