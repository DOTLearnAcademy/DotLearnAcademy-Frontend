<div class="auth-page">
  <div class="auth-layout">
    <!-- Left -->
    <div class="auth-brand">
      <div class="brand-box">
        <div class="brand-mark">D</div>
        <h1>Start your journey</h1>
        <p>
          Join DOTLearn and unlock structured learning, progress tracking,
          and certifications.
        </p>
      </div>
    </div>

    <!-- Right -->
    <div class="auth-form-wrap">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card">
        <h2>Create account</h2>
        <p class="subtext">Start learning in minutes</p>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="name">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password">
        </mat-form-field>

        <button type="submit" class="primary-btn" [disabled]="form.invalid || isLoading">
          <mat-icon>person_add</mat-icon>
          <span>{{ isLoading ? 'Creating...' : 'Create Account' }}</span>
        </button>

        <div class="auth-footer">
          <span>Already have an account?</span>
          <a routerLink="/auth/login">Sign in</a>
        </div>
      </form>
    </div>
  </div>
</div>
