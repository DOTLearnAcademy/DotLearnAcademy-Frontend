<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Welcome Back</mat-card-title>
      <mat-card-subtitle>Sign in to your DOTLearn account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="you@example.com">
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email format</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password"
                 [type]="hidePassword ? 'password' : 'text'">
          <button mat-icon-button matSuffix type="button"
                  (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('password')?.hasError('required')">
            Password is required
          </mat-error>
        </mat-form-field>

        <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

        <button mat-raised-button color="primary" type="submit"
                class="full-width submit-btn" [disabled]="isLoading">
          <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
          <span *ngIf="!isLoading">Sign In</span>
        </button>

      </form>

      <mat-divider class="divider"></mat-divider>

      <div class="oauth-buttons">
        <button mat-stroked-button class="full-width oauth-btn">
          <img src="assets/google-icon.svg" width="20" alt="Google">
          Continue with Google
        </button>
        <button mat-stroked-button class="full-width oauth-btn">
          <mat-icon>code</mat-icon>
          Continue with GitHub
        </button>
      </div>

      <div class="auth-links">
        <a routerLink="/auth/forgot-password">Forgot password?</a>
        <span>Don't have an account? <a routerLink="/auth/register">Sign up</a></span>
      </div>
    </mat-card-content>
  </mat-card>
</div>
