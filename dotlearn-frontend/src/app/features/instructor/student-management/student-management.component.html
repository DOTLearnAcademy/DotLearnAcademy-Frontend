<div class="students-page">
  <div class="page-header">
    <h1>Student Management</h1>
    <a mat-button routerLink="/instructor/courses">
      <mat-icon>arrow_back</mat-icon> Back
    </a>
  </div>

  <div class="filter-tabs">
    <button mat-button [class.active]="activeFilter === 'all'"
            (click)="filter('all')">All ({{ students.length }})</button>
    <button mat-button [class.active]="activeFilter === 'not-started'"
            (click)="filter('not-started')">Not Started</button>
    <button mat-button [class.active]="activeFilter === 'in-progress'"
            (click)="filter('in-progress')">In Progress</button>
    <button mat-button [class.active]="activeFilter === 'completed'"
            (click)="filter('completed')">Completed</button>
  </div>

  <mat-progress-bar mode="indeterminate" *ngIf="isLoading"></mat-progress-bar>

  <mat-table [dataSource]="filteredStudents" *ngIf="!isLoading" class="students-table">
    <ng-container matColumnDef="student">
      <mat-header-cell *matHeaderCellDef>Student ID</mat-header-cell>
      <mat-cell *matCellDef="let s">{{ s.studentId | slice:0:8 }}...</mat-cell>
    </ng-container>

    <ng-container matColumnDef="enrolled">
      <mat-header-cell *matHeaderCellDef>Enrolled</mat-header-cell>
      <mat-cell *matCellDef="let s">{{ s.enrolledAt | date:'mediumDate' }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="progress">
      <mat-header-cell *matHeaderCellDef>Progress</mat-header-cell>
      <mat-cell *matCellDef="let s">
        <div class="progress-cell">
          <mat-progress-bar mode="determinate" [value]="s.progressPercent">
          </mat-progress-bar>
          <span>{{ s.progressPercent | number:'1.0-0' }}%</span>
        </div>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
      <mat-cell *matCellDef="let s">
        <mat-chip [color]="s.status === 'Completed' ? 'accent' : 'primary'" selected>
          {{ s.status }}
        </mat-chip>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
</div>
